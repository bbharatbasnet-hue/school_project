{% extends 'base.html' %} {% load static %} {% block content %}


    <main id="main">
      <section class="page-hero">
        <div class="container">
          <div class="breadcrumb"><a href="{% url 'index' %}">Home</a> / Contact</div>
          <h1>Get In Touch</h1>
        </div>
      </section>

      <section class="section">
        <div class="container">
          <div class="grid grid-4" style="margin-bottom: 44px">
            <div class="card reveal text-center" style="padding: 26px">
              <div class="icon-tile" style="margin: 0 auto 14px">
                <i class="fa-solid fa-phone"></i>
              </div>
              <h3 style="font-size: 15.5px">Call Us</h3>
              <p style="font-size: 13.5px">+977-81-000000</p>
            </div>
            <div class="card reveal text-center" style="padding: 26px">
              <div class="icon-tile crimson" style="margin: 0 auto 14px">
                <i class="fa-solid fa-envelope"></i>
              </div>
              <h3 style="font-size: 15.5px">Email Us</h3>
              <p style="font-size: 13.5px">info@juniorcambridge.edu.np</p>
            </div>
            <div class="card reveal text-center" style="padding: 26px">
              <div class="icon-tile" style="margin: 0 auto 14px">
                <i class="fa-solid fa-location-dot"></i>
              </div>
              <h3 style="font-size: 15.5px">Visit Us</h3>
              <p style="font-size: 13.5px">Surkhet Road, Nepalgunj-12</p>
            </div>
            <div class="card reveal text-center" style="padding: 26px">
              <div class="icon-tile crimson" style="margin: 0 auto 14px">
                <i class="fa-solid fa-share-nodes"></i>
              </div>
              <h3 style="font-size: 15.5px">Follow Us</h3>
              <div
                class="social-row"
                style="justify-content: center; margin-top: 8px"
              >
                <a
                  href="#"
                  style="background: var(--paper-2); color: var(--navy)"
                  ><i class="fa-brands fa-facebook-f"></i></a
                ><a
                  href="#"
                  style="background: var(--paper-2); color: var(--navy)"
                  ><i class="fa-brands fa-instagram"></i
                ></a>
              </div>
            </div>
          </div>

          <div class="grid grid-2" style="gap: 40px; align-items: stretch">
            <div class="card reveal" style="padding: 36px">
              <span class="eyebrow">Send a Message</span>
              <h2 style="font-size: 24px">We'll Get Back to You Soon</h2>
             <form method="post" action="{% url 'contact' %}">
    {% csrf_token %}

    <div class="grid grid-2" style="gap: 16px">
        <div class="form-field">
            <label>Full Name</label>
            <input type="text" required name="full_name">
        </div>

        <div class="form-field">
            <label>Phone</label>
            <input type="tel" required name="phone_number">
        </div>
    </div>

    <div class="form-field">
        <label>Email</label>
        <input type="email" required name="email">
    </div>

    <div class="form-field">
        <label>Subject</label>
        <input type="text" name="subject">
    </div>

    <div class="form-field">
        <label>Message</label>
        <textarea rows="5" required name="message"></textarea>
    </div>

    <button class="btn btn-crimson" type="submit">
        Send Message
        <i class="fa-solid fa-paper-plane"></i>
    </button>
</form>
            </div>
            <div
              class="reveal"
              style="
                border-radius: 20px;
                overflow: hidden;
                box-shadow: var(--shadow);
                min-height: 420px;
              "
            >
              <iframe
                src="https://www.google.com/maps?q=Nepalgunj,Nepal&output=embed"
                width="100%"
                height="100%"
                style="border: 0; min-height: 420px"
                loading="lazy"
                title="School location map"
              ></iframe>
            </div>
          </div>
        </div>
      </section>
    </main>

    {% endblock %}
  </body>
</html>
